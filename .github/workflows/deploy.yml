name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每天 UTC 00:30 运行 = 北京时间 08:30
    #
    # 注意两件事：
    #   1. GitHub 的定时任务在高峰期可能延迟几分钟到几十分钟，这是正常的
    #   2. 仓库连续 60 天没有任何提交活动时，GitHub 会自动暂停定时任务。
    #      本工作流每天都会提交数据更新，所以不会被暂停
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write # 数据更新后要提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装数据脚本依赖
        run: |
          python3 -m pip install --upgrade pip --quiet
          python3 -m pip install numpy --quiet
          # 如果你自己的数据脚本还要别的包，写在 tools/quant/requirements.txt 里
          if [ -f tools/quant/requirements.txt ]; then
            echo "安装 tools/quant/requirements.txt"
            python3 -m pip install -r tools/quant/requirements.txt --quiet
          fi

      - name: 更新量化数据
        run: python3 tools/update-quant-data.py
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: 提交数据变更
        run: |
          # 数据没变就不提交，避免产生空提交。
          # 用 git status 而不是 git diff，这样新增的未跟踪文件也能覆盖到。
          if [ -z "$(git status --porcelain -- src/data/quant.json)" ]; then
            echo "数据没有变化，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/quant.json
          git commit -m "自动更新量化数据 $(date -u '+%Y-%m-%d')"
          git push
          echo "已提交并推送"

      - name: 自动判断部署地址
        id: paths
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"

          if [ -n "$CUSTOM_SITE_URL" ]; then
            # 已配置自定义域名（仓库 Settings → Variables 里加一个 SITE_URL）
            echo "site_url=$CUSTOM_SITE_URL" >> "$GITHUB_OUTPUT"
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            # 用户主页仓库，部署在根目录
            echo "site_url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            # 普通项目仓库，部署在子目录 /仓库名/
            echo "site_url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/${REPO}" >> "$GITHUB_OUTPUT"
          fi

          echo "---- 本次部署 ----"
          echo "仓库: $OWNER/$REPO"
          echo "地址: $(grep site_url "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "路径: $(grep base_path "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建网站
        run: pnpm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ steps.paths.outputs.site_url }}
          BASE_PATH: ${{ steps.paths.outputs.base_path }}

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
