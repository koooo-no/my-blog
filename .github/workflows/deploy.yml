name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 自动判断部署地址
        id: paths
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"

          if [ -n "$CUSTOM_SITE_URL" ]; then
            # 已配置自定义域名（仓库 Settings → Variables 里加一个 SITE_URL）
            echo "site_url=$CUSTOM_SITE_URL" >> "$GITHUB_OUTPUT"
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            # 用户主页仓库，部署在根目录
            echo "site_url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            # 普通项目仓库，部署在子目录 /仓库名/
            echo "site_url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/${REPO}" >> "$GITHUB_OUTPUT"
          fi

          echo "---- 本次部署 ----"
          echo "仓库: $OWNER/$REPO"
          echo "地址: $(grep site_url "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "路径: $(grep base_path "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建网站
        run: pnpm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ steps.paths.outputs.site_url }}
          BASE_PATH: ${{ steps.paths.outputs.base_path }}

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
